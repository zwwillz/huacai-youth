name: Apply Snooker player Phase 1

on:
  push:
    branches:
      - agent/snooker-player-phase1-inline-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply scoped player patch
        run: node scripts/apply-player-phase1.mjs
      - name: Commit final scoped changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: inline player detail under root player view"
          git push origin HEAD:agent/snooker-player-phase1-inline-v2
