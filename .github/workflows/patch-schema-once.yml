name: Align schema and event write guard once

on:
  push:
    branches: ["agent/stability-safety-regression-20260811"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stability-safety-regression-20260811
      - name: Apply focused schema and event guard patches
        shell: python
        run: |
          from pathlib import Path

          schema = Path("db/schema.ts")
          text = schema.read_text()
          anchor = '  registrationEndAt: text("registration_end_at"),\n'
          addition = anchor + '  registrationState: text("registration_state").notNull().default("not_open"),\n  registrationUrl: text("registration_url"),\n'
          if 'registrationState: text("registration_state")' not in text:
            text = text.replace(anchor, addition, 1)
          anchor2 = '  isHidden: boolean("is_hidden").notNull().default(false),\n'
          addition2 = anchor2 + '  isTest: boolean("is_test").notNull().default(false),\n'
          if 'isTest: boolean("is_test")' not in text:
            text = text.replace(anchor2, addition2, 1)
          schema.write_text(text)

          event_management = Path("db/event-management.ts")
          text = event_management.read_text()
          text = text.replace('async function requireEventEditor(username: string, eventId: string) {\n  return requireEventAccess(username, eventId, {\n    allowedRoles:', 'async function requireEventEditor(username: string, eventId: string, write = false) {\n  return requireEventAccess(username, eventId, {\n    write,\n    allowedRoles:', 1)
          marker = 'export async function saveEventManagementData(username: string, input: EventManagementInput) {'
          start = text.index(marker)
          suffix = text[start:]
          suffix = suffix.replace('const account = await requireEventEditor(username, input.eventId);', 'const account = await requireEventEditor(username, input.eventId, true);', 1)
          text = text[:start] + suffix
          event_management.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/schema.ts db/event-management.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: guard archived event management writes"
          git push origin HEAD:agent/stability-safety-regression-20260811
