name: Patch Snooker preload taxonomy

on:
  push:
    branches:
      - agent/snooker-preload-player-event-taxonomy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/snooker-preload-player-event-taxonomy
          fetch-depth: 0

      - name: Apply exact patch
        run: node scripts/patch-snooker-preload-taxonomy.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/snooker/player-data.ts lib/snooker/player-detail-fast.ts lib/snooker/database-public.ts app/snooker/snooker-data-center-v2.tsx tests/snooker-player-avatar-resolution.test.mjs
          git diff --cached --quiet && exit 1
          git commit -m "feat: wire player status event taxonomy and prefetch"
          git push origin HEAD:agent/snooker-preload-player-event-taxonomy
