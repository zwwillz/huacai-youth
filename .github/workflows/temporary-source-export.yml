name: Temporary source export
on:
  push:
    branches:
      - frontend-db-preserve-ui-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: tar --exclude=.git -czf /tmp/huacai-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: huacai-source
          path: /tmp/huacai-source.tar.gz
          retention-days: 1
