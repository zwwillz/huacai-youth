name: Mark legacy draw entry deprecated

on:
  push:
    branches: ["agent/stability-safety-regression-20260811"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stability-safety-regression-20260811
      - name: Mark legacy function deprecated
        shell: python
        run: |
          from pathlib import Path
          path = Path("db/draw-engine.ts")
          text = path.read_text()
          target = "export async function createQualificationDraw("
          if "/** @deprecated Use createQualificationDrawFast" not in text:
            text = text.replace(target, "/** @deprecated Use createQualificationDrawFast from draw-engine-write.ts. This legacy first-version path must not be used for q1/q2 production draws. */\n" + target, 1)
          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/draw-engine.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore: deprecate legacy qualification draw entry"
          git push origin HEAD:agent/stability-safety-regression-20260811
