name: Patch Snooker Player Route V2

on:
  push:
    branches:
      - agent/snooker-player-route-fix-v2
    paths:
      - .github/workflows/patch-snooker-player-route-v2.yml
      - .github/scripts/patch-snooker-player-route-v2.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/snooker-player-route-fix-v2
      - name: Apply route repair
        run: node .github/scripts/patch-snooker-player-route-v2.mjs
      - name: Commit repaired routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/snooker/snooker-data-center-v2.tsx
          git diff --cached --quiet || git commit -m "fix: route V2 player links to formal player module"
          git push origin HEAD:agent/snooker-player-route-fix-v2
