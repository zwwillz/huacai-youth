name: Patch public group url once

on:
  push:
    branches: ["agent/stability-safety-regression-20260811"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stability-safety-regression-20260811
      - name: Sync public group selection to URL
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/public-competition-live-v2.tsx")
          text = path.read_text()
          anchor = '''function GroupSwitch({ group, setGroup }: { group: Group; setGroup: (group: Group) => void }) {
            return <div className="group-switch" aria-label="选择比赛组别"><button className={group === "少年组" ? "active" : ""} onClick={() => setGroup("少年组")}><b>U16</b><span>少年组</span></button><button className={group === "青年组" ? "active" : ""} onClick={() => setGroup("青年组")}><b>U20</b><span>青年组</span></button></div>;
          }
          '''
          helper = anchor + '''
          function groupFromUrl(): Group {
            if (typeof window === "undefined") return "少年组";
            const value = new URLSearchParams(window.location.search).get("group");
            return value === "u20" || value === "青年组" ? "青年组" : "少年组";
          }

          function usePublicGroup() {
            const [group, setGroupState] = useState<Group>(groupFromUrl);
            useEffect(() => {
              const restore = () => setGroupState(groupFromUrl());
              window.addEventListener("popstate", restore);
              return () => window.removeEventListener("popstate", restore);
            }, []);
            const setGroup = useCallback((next: Group) => {
              setGroupState(next);
              const params = new URLSearchParams(window.location.search);
              params.set("group", next === "青年组" ? "u20" : "u16");
              window.history.pushState({}, "", `${window.location.pathname}?${params.toString()}${window.location.hash}`);
            }, []);
            return [group, setGroup] as const;
          }
          '''
          if "function usePublicGroup()" not in text:
            if anchor not in text:
              raise SystemExit("GroupSwitch anchor not found")
            text = text.replace(anchor, helper, 1)
          text = text.replace('const [group, setGroup] = useState<Group>("少年组"); const [detail, setDetail] = useState<PhaseId | null>(null);', 'const [group, setGroup] = usePublicGroup(); const [detail, setDetail] = useState<PhaseId | null>(null);', 1)
          text = text.replace('const [group, setGroup] = useState<Group>("少年组");\n  const all = useMemo', 'const [group, setGroup] = usePublicGroup();\n  const all = useMemo', 1)
          text = text.replace('const [group, setGroup] = useState<Group>("少年组"); const finalRows = rankings.filter', 'const [group, setGroup] = usePublicGroup(); const finalRows = rankings.filter', 1)
          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public-competition-live-v2.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: persist public group in url"
          git push origin HEAD:agent/stability-safety-regression-20260811
