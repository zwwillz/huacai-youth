name: Validate Preserve UI DB Refactor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'frontend-db-preserve-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
      - name: Apply data-source-only codemod
        run: python .tmp/apply-preserve-ui-db.py
      - name: Normalize database strings for legacy layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('db/public.ts')
          text=p.read_text()
          old='''    const prefix = locationPrefix([row.venueProvince, row.venueCity, row.venueDistrict]);
    return {'''
          new='''    const prefix = locationPrefix([row.venueProvince, row.venueCity, row.venueDistrict]);
    const venuePrefix = row.venueDistrict?.includes("/") ? row.city : prefix;
    const format = asStringRows(row.competitionFormat);
    const prizes = asPrizeMap(row.prizes);
    if (!format.length) format.push(["待公布", "待公布", "待公布", "待公布"]);
    for (const group of GROUPS) if (!prizes[group].length) prizes[group] = [["冠军", "待公布"]];
    return {'''
          if old in text: text=text.replace(old,new,1)
          text=text.replace('sponsor: row.sponsorLabel || (sponsorsByEvent.get(row.id) ?? []).join(" · "),','sponsor: row.sponsorLabel || (sponsorsByEvent.get(row.id) ?? []).join(" · ") || "赛事信息待公布",',1)
          text=text.replace('duration: row.durationLabel || "",','duration: row.durationLabel || "待公布",',1)
          text=text.replace('venue: [prefix, row.venueName].filter(Boolean).join(" · "),','venue: [venuePrefix, row.venueName].filter(Boolean).join(" · "),',1)
          text=text.replace('venueDetail: row.venueAddress ? `${prefix}${row.venueAddress}` : [prefix, row.venueName].filter(Boolean).join(" · "),','venueDetail: row.venueAddress || [prefix, row.venueName].filter(Boolean).join(" · "),',1)
          text=text.replace('rulesPdf: docs.regulation ?? "",','rulesPdf: docs.regulation || "#",',1)
          text=text.replace('refereesPdf: docs.referee_list ?? "",','refereesPdf: docs.referee_list || "#",',1)
          text=text.replace('format: asStringRows(row.competitionFormat),','format,',1)
          text=text.replace('prizes: asPrizeMap(row.prizes),','prizes,',1)
          p.write_text(text)
          PY
      - name: Assert styles untouched
        run: git diff --exit-code origin/main -- app/globals.css
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
      - name: Commit validated UI-preserving change
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/event-app.tsx db/public.ts
            git commit -m "feat: preserve original layout with database data"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
