name: Patch Snooker Player 512 Avatar

on:
  push:
    branches:
      - agent/snooker-player-512-avatar
    paths:
      - .github/workflows/patch-snooker-player-512-avatar.yml
      - .github/scripts/patch-snooker-player-512-avatar.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/snooker-player-512-avatar
      - name: Apply avatar resolution patch
        run: node .github/scripts/patch-snooker-player-512-avatar.mjs
      - name: Commit patched player data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/snooker/player-data.ts
          git diff --cached --quiet || git commit -m "feat: use 512 WebP for player detail portraits"
          git push origin HEAD:agent/snooker-player-512-avatar
