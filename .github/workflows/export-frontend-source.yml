name: Export Frontend Source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload frontend source
        uses: actions/upload-artifact@v4
        with:
          name: frontend-source
          path: |
            app
            db
            public
            package.json
            tsconfig.json
            next.config.*
          if-no-files-found: error
          retention-days: 1
