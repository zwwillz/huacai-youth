name: Validate Frontend DB Refactor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Decode refactor payload
        run: |
          cat .tmp/refactor.part00 .tmp/refactor.part01 .tmp/refactor.part02 .tmp/refactor.part03 .tmp/refactor.part04 .tmp/refactor.part05 | base64 -d > /tmp/frontend-db-refactor.tar.gz
          echo "de7b697d3a6eb36274b23d2a314bd43ef94b531dfe64b31b0818afe004267adb  /tmp/frontend-db-refactor.tar.gz" | sha256sum -c -
      - name: Apply changes on clean main branch
        run: |
          git fetch origin main
          git checkout -B frontend-db-refactor origin/main
          tar -xzf /tmp/frontend-db-refactor.tar.gz
          ! grep -RIn --exclude=appearance.json -E 'import appearance|stationList|const stations|const phases|matchDays|isLangfang' app db
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Push validated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/event-app.tsx app/public-types.ts db/public.ts db/schema.ts
          git commit -m "feat: read public competition pages from database"
          git push --force origin frontend-db-refactor
