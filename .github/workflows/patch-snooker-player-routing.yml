name: Patch Snooker Player Routing

on:
  push:
    branches: ["agent/snooker-player-supabase-v2"]
    paths:
      - ".github/workflows/patch-snooker-player-routing.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/snooker-player-supabase-v2
      - name: Patch current main-based Snooker component
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/snooker/snooker-data-center.tsx")
          text = path.read_text()

          replacements = [
              (
                  'import { useCallback, useEffect, useMemo, useRef, useState } from "react";\n',
                  'import { useCallback, useEffect, useMemo, useRef, useState } from "react";\nimport { useRouter } from "next/navigation";\n',
              ),
              (
                  '  buildMark,\n}: {',
                  '  buildMark,\n  initialView = "home",\n}: {',
              ),
              (
                  '  buildMark: string;\n}) {\n  const [snapshot, setSnapshot] = useState(initialSnapshot);',
                  '  buildMark: string;\n  initialView?: "home" | "matches" | "data";\n}) {\n  const router = useRouter();\n  const [snapshot, setSnapshot] = useState(initialSnapshot);',
              ),
              (
                  '  const [activeView, setActiveView] = useState<MainView>("home");',
                  '  const [activeView, setActiveView] = useState<MainView>(initialView);',
              ),
              (
                  '  const openPlayer = (playerIdValue: string) => { setDetail({ type: "player", playerId: playerIdValue }); window.scrollTo({ top: 0, behavior: "smooth" }); };',
                  '  const openPlayer = (playerIdValue: string) => { const target = players.get(playerIdValue); router.push(target?.slug ? `/snooker/players/${target.slug}` : "/snooker/players"); };',
              ),
              (
                  '  const changeView = (view: MainView) => { setDetail(null); setActiveView(view); window.scrollTo({ top: 0, behavior: "smooth" }); };',
                  '  const changeView = (view: MainView) => {\n    if (view === "players") { router.push("/snooker/players"); return; }\n    setDetail(null);\n    setActiveView(view);\n    try { window.history.replaceState(null, "", view === "home" ? "/snooker" : `/snooker?view=${view}`); } catch {}\n    window.scrollTo({ top: 0, behavior: "smooth" });\n  };',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit routing patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/snooker/snooker-data-center.tsx
          git commit -m "feat: route Snooker player entry points to formal module"
          git push origin HEAD:agent/snooker-player-supabase-v2
