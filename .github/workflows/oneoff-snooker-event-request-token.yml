name: One-off Snooker event request token fix

on:
  push:
    branches:
      - agent/snooker-dashboard-resilience-core
    paths:
      - scripts/fix-snooker-event-request-token.mjs
      - .github/workflows/oneoff-snooker-event-request-token.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/snooker-dashboard-resilience-core
          fetch-depth: 0
      - run: node scripts/fix-snooker-event-request-token.mjs
      - run: rm scripts/fix-snooker-event-request-token.mjs .github/workflows/oneoff-snooker-event-request-token.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/snooker/snooker-data-center-v2.tsx scripts/fix-snooker-event-request-token.mjs .github/workflows/oneoff-snooker-event-request-token.yml
          git commit -m "fix: guard concurrent event detail cleanup"
          git push origin HEAD:agent/snooker-dashboard-resilience-core
