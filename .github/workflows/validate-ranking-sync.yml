name: Validate Preserve UI After Ranking Sync

on:
  pull_request:
    branches: [frontend-db-preserve-ui]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
