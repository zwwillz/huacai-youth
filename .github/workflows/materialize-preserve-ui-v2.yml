name: Materialize Preserve UI Database Branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'frontend-db-preserve-ui-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend-db-preserve-ui-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
      - name: Copy validated database data layer into latest main UI
        run: |
          git fetch origin frontend-db-preserve-ui
          git show origin/frontend-db-preserve-ui:app/event-app.tsx > app/event-app.tsx
          git show origin/frontend-db-preserve-ui:app/public-types.ts > app/public-types.ts
          git show origin/frontend-db-preserve-ui:db/public.ts > db/public.ts
          cat > app/page.tsx <<'EOF'
          import EventApp from "./event-app";
          import LangfangRankingStatic from "./langfang-ranking-static";
          import { getPublicSiteData } from "@/db/public";

          export const dynamic = "force-dynamic";
          export const revalidate = 0;

          export default async function Home() {
            const data = await getPublicSiteData();
            return <><EventApp data={data} /><LangfangRankingStatic /></>;
          }
          EOF
      - name: Assert original styles and ranking UI untouched
        run: |
          git diff --exit-code origin/main -- app/globals.css
          test "$(git hash-object app/langfang-ranking-static.tsx)" = "$(git rev-parse origin/main:app/langfang-ranking-static.tsx)"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
      - name: Commit only business changes
        run: |
          rm .github/workflows/materialize-preserve-ui-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect database while preserving original frontend design"
          git push --force origin HEAD:frontend-db-preserve-ui-v2
